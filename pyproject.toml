[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawback"
version = "0.1.0"
description = "AI-powered bill and contract analyzer that finds every dollar you're overpaying and drafts negotiation messages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Clawback Team" }]

dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<14",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "anthropic>=0.30,<1",
    "openai>=1.30,<2",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mcp[cli]>=1,<2",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
]

[project.scripts]
clawback = "clawback.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["clawback"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
